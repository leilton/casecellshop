global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: api
    static_configs: [{ targets: ["api:3000"] }]
  - job_name: worker
    static_configs: [{ targets: ["worker:9464"] }]
  - job_name: otel-spanmetrics
    static_configs: [{ targets: ["otel-collector:8889"] }]
