# Telemetry pipeline. In production, swap/add the `datadog` exporter
# (already bundled in the contrib image) — the application doesn't change, only this file.
receivers:
  otlp:
    protocols:
      grpc: { endpoint: 0.0.0.0:4317 }
      http: { endpoint: 0.0.0.0:4318 }

processors:
  batch: {}
  memory_limiter:
    check_interval: 1s
    limit_mib: 256

connectors:
  # Generates RED metrics (rate, errors, duration) from spans
  spanmetrics:
    dimensions:
      - name: http.route
      - name: http.response.status_code

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls: { insecure: true }
  prometheus:
    endpoint: 0.0.0.0:8889
  debug:
    verbosity: basic
  # datadog:
  #   api:
  #     key: ${env:DD_API_KEY}
  #     site: datadoghq.com

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger, spanmetrics]
    metrics:
      receivers: [otlp, spanmetrics]
      processors: [memory_limiter, batch]
      exporters: [prometheus]
