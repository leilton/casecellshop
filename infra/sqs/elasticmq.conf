include classpath("application.conf")

node-address {
  protocol = http
  host = sqs
  port = 9324
  context-path = ""
}

rest-sqs {
  enabled = true
  bind-port = 9324
  bind-hostname = "0.0.0.0"
  sqs-limits = strict
}

rest-stats {
  enabled = true
  bind-port = 9325
  bind-hostname = "0.0.0.0"
}

queues {
  # Main checkout queue. An unacknowledged message becomes visible again after 30s;
  # after 5 unsuccessful receives it moves to the DLQ (redrive).
  checkout-orders {
    defaultVisibilityTimeout = 30 seconds
    receiveMessageWait = 20 seconds
    deadLettersQueue {
      name = "checkout-orders-dlq"
      maxReceiveCount = 5
    }
  }
  checkout-orders-dlq {
    defaultVisibilityTimeout = 30 seconds
  }
}
